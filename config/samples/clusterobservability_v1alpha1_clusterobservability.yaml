# Example ClusterObservability configuration
# This resource manages a complete observability stack for your Kubernetes cluster.
#
# spec.exporter is passed verbatim to the OTLP HTTP exporter on every collector
# pipeline. Anything supported by the official OpenTelemetry Collector
# otlphttpexporter is accepted; the operator does not introspect the schema. At
# minimum, "endpoint" (or one of traces_endpoint / metrics_endpoint /
# logs_endpoint) must be set.
#
# See https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/otlphttpexporter/README.md
apiVersion: opentelemetry.io/v1alpha1
kind: ClusterObservability
metadata:
  name: cluster-observability
  namespace: opentelemetry-operator-system
spec:
  exporter:
    endpoint: "https://otel-backend.example.com:4318"
    # Optional: per-signal endpoint overrides
    # traces_endpoint: "https://trace-backend.example.com/v2/trace/otlp"
    # metrics_endpoint: "https://metrics-backend.example.com/v2/datapoint/otlp"
    # logs_endpoint: "https://logs-backend.example.com/v1/logs"
    headers:
      Authorization: "Bearer your-token-here"
    compression: gzip
    timeout: "30s"
    # tls:
    #   insecure: false
    #   server_name: "otel-backend.example.com"
    # retry_on_failure:
    #   enabled: true
    #   initial_interval: "5s"
    #   max_interval: "30s"
    #   max_elapsed_time: "5m"
    # sending_queue:
    #   enabled: true
    #   num_consumers: 10
    #   queue_size: 1000
