#
# Valid exporter config: includes "endpoint", plus arbitrary additional fields
# the operator does not introspect (compression, timeout, headers, custom
# sub-objects). The webhook must accept this and the controller must reconcile.
apiVersion: opentelemetry.io/v1alpha1
kind: ClusterObservability
metadata:
  name: test-webhook-validation
spec:
  exporter:
    endpoint: "http://test-otel-collector.default.svc.cluster.local:4318"
    compression: gzip
    timeout: "30s"
    headers:
      X-Test-Header: "value"
    sending_queue:
      enabled: true
      queue_size: 1000
